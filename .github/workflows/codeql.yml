name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '34 13 * * 6'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: java-kotlin
          build-mode: manual

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      if: matrix.language == 'java-kotlin'
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      if: matrix.language == 'java-kotlin'
      uses: gradle/actions/setup-gradle@v3

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Compile Java/Kotlin Code
      if: matrix.build-mode == 'manual'
      run: |
        # إعطاء صلاحية لأي ملف gradlew موجود في أي مسار بالمشروع
        find . -name "gradlew" -exec chmod +x {} +
        
        # محاولة البناء عبر gradlew إذا وُجد، أو عبر gradle العام
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug --no-daemon || ./gradlew compileJava --no-daemon || ./gradlew testClasses --no-daemon
        elif find . -name "gradlew" | grep -q gradlew; then
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          GRADLE_DIR=$(dirname "$GRADLEW_PATH")
          (cd "$GRADLE_DIR" && ./gradlew assembleDebug --no-daemon || ./gradlew compileJava --no-daemon)
        elif [ -f "./pom.xml" ]; then
          mvn compile -B
        else
          gradle assembleDebug --no-daemon || gradle compileJava --no-daemon || true
        fi

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
